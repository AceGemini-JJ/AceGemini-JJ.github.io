<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 記憶翻牌 2.0</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(
      #91e5ff 0 58%,
      #91d66f 58% 100%
    );
  color:#17354a;
  text-align:center;
  overflow-x:hidden;
}

.screen{
  display:none;
  max-width:1100px;
  margin:auto;
  padding:24px 14px 32px;
  position:relative;
  z-index:2;
}

.screen.active{
  display:block;
}

/* 標題 */

h1{
  font-size:clamp(34px,7vw,58px);
  margin:10px 0;
  color:#135d86;
  text-shadow:
    2px 3px #fff,
    0 0 12px rgba(255,255,255,.8);
}

.subtitle{
  font-size:20px;
  font-weight:700;
  margin:8px auto 25px;
}

/* 控制列 */

.homebar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

button{
  border:0;
  border-radius:16px;
  padding:11px 16px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.16);
  transition:.15s;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 rgba(0,0,0,.16);
}

.music{
  background:#ffe082;
  color:#6d4c00;
}

.sound{
  background:#c8e6c9;
  color:#245b27;
}

.backbtn{
  background:#fff;
}

/* 難度 */

.levels{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  max-width:760px;
  margin:auto;
}

.level-card{
  background:rgba(255,255,255,.94);
  border-radius:25px;
  padding:25px 18px;
  box-shadow:0 10px 25px rgba(0,0,0,.16);
  border:4px solid transparent;
  position:relative;
  overflow:hidden;
}

.level-card:before{
  content:"";
  position:absolute;
  top:-80%;
  left:-120%;
  width:80%;
  height:250%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.75),
    transparent
  );
  transform:rotate(25deg);
  animation:sweep 3s infinite;
}

.level-card>*{
  position:relative;
}

@keyframes sweep{
  0%,65%{
    left:-120%;
  }

  100%{
    left:120%;
  }
}

.level-icon{
  font-size:52px;
}

.level-title{
  font-size:28px;
  font-weight:900;
  margin:6px;
}

.level-info{
  font-size:16px;
  line-height:1.8;
  margin:8px;
}

.easy{
  border-color:#66bb6a;
}

.normal{
  border-color:#42a5f5;
}

.hard{
  border-color:#ff9800;
}

.pro{
  border-color:#ef5350;
}

.play{
  color:#fff;
  padding:12px 28px;
}

.easy .play{
  background:#43a047;
}

.normal .play{
  background:#1e88e5;
}

.hard .play{
  background:#f57c00;
}

.pro .play{
  background:#e53935;
}

/* 遊戲上方 */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.top h2{
  margin:0;
  font-size:27px;
  color:#155b7c;
}

.controls{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
}

/* 數據 */

.stats{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:13px auto;
}

.stat{
  background:rgba(255,255,255,.94);
  padding:8px 14px;
  border-radius:14px;
  min-width:105px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.stat b{
  display:block;
  font-size:21px;
  color:#15627d;
}

/* 訊息 */

#message{
  min-height:34px;
  font-size:21px;
  font-weight:900;
  color:#15556e;
}

/* 重新開始 */

.restart{
  background:#ffca28;
  color:#5d4300;
  margin:6px;
}

/* 卡片 */

#game{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  max-width:1000px;
  margin:12px auto;
}

.card{
  aspect-ratio:1/1;
  perspective:1000px;
  cursor:pointer;
  position:relative;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:
    transform .55s cubic-bezier(.2,.8,.2,1);
}

.card.flipped .card-inner,
.card.matched .card-inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border-radius:18px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 5px 12px rgba(0,0,0,.2);
}

.back{
  background:
    linear-gradient(
      135deg,
      #7c4dff,
      #2979ff
    );

  border:4px solid #fff;
  color:#fff;
  font-size:45px;

  box-shadow:
    0 0 12px rgba(41,121,255,.5);
}

.front{
  transform:rotateY(180deg);

  background:#fff;

  border:4px solid #80deea;

  font-size:clamp(32px,6vw,60px);
}

/* 翻牌發光 */

.card.flipped .front{
  animation:cardGlow .55s;
}

@keyframes cardGlow{

  0%{
    filter:brightness(1);
  }

  40%{
    filter:brightness(1.9);

    box-shadow:
      0 0 25px #7df9ff,
      0 0 55px #4fc3f7,
      0 0 90px rgba(79,195,247,.7);
  }

  70%{
    filter:brightness(1.3);
  }

  100%{
    filter:brightness(1);
  }
}

/* 配對成功 */

.card.matched .front{
  border-color:#ffd54f;
  animation:perfect .75s;
}

@keyframes perfect{

  0%{
    transform:rotateY(180deg) scale(1);
  }

  30%{
    transform:
      rotateY(180deg)
      scale(1.15);

    box-shadow:
      0 0 25px #fff,
      0 0 55px #ffd740,
      0 0 100px #ffab00;
  }

  55%{
    transform:
      rotateY(180deg)
      scale(1.05);
  }

  75%{
    transform:
      rotateY(180deg)
      scale(.96);
  }

  100%{
    transform:
      rotateY(180deg)
      scale(1);

    box-shadow:
      0 0 15px #ffd54f;
  }
}

/* 翻錯 */

.card.wrong .card-inner{
  animation:shake .4s;
}

.card.wrong .front{
  box-shadow:
    0 0 28px #ff5252;
}

@keyframes shake{

  20%{
    transform:rotate(-6deg);
  }

  40%{
    transform:rotate(6deg);
  }

  60%{
    transform:rotate(-5deg);
  }

  80%{
    transform:rotate(4deg);
  }
}

/* 粒子特效 */

#fx{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden;
}

.spark{
  position:absolute;

  width:9px;
  height:9px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 12px #fff,
    0 0 25px #ffd740;

  animation:
    spark .8s ease-out forwards;
}

@keyframes spark{

  to{
    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(0);

    opacity:0;
  }
}

/* 光圈 */

.ring{
  position:absolute;

  border:
    5px solid #fff;

  border-radius:50%;

  box-shadow:
    0 0 30px #ffd740;

  animation:
    ring .65s ease-out forwards;
}

@keyframes ring{

  to{
    width:280px;
    height:280px;

    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1.4);
  }
}

/* PERFECT文字 */

#toast{
  position:fixed;

  left:50%;
  top:42%;

  transform:
    translate(-50%,-50%)
    scale(.6);

  opacity:0;

  z-index:30;

  font-size:
    clamp(30px,8vw,70px);

  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 8px #ff9800,
    0 0 28px #ff5722,
    0 0 50px #ffd740;

  pointer-events:none;
}

#toast.show{
  animation:
    toast .9s ease-out;
}

@keyframes toast{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.5);
  }

  25%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.15);
  }

  70%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(1.3);
  }
}

/* 完成視窗 */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:40;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:#fff;

  border-radius:28px;

  padding:30px;

  width:min(460px,94vw);

  box-shadow:
    0 15px 50px rgba(0,0,0,.45);
}

.modalbox h2{
  font-size:35px;
  color:#f57c00;
  margin:4px;
}

.stars{
  font-size:42px;
  margin:10px;
}

.result{
  font-size:20px;
  line-height:1.9;
}

/* 作者 */

footer{
  margin-top:20px;
  font-weight:800;
  color:#315d2f;
}

/* 手機 */

@media(max-width:760px){

  #game{
    grid-template-columns:
      repeat(4,1fr);

    gap:8px;
  }

  .levels{
    grid-template-columns:1fr;
  }

  .top{
    justify-content:center;
  }

  .stat{
    min-width:90px;
  }
}

@media(max-width:430px){

  #game{
    grid-template-columns:
      repeat(3,1fr);
  }

  button{
    font-size:14px;
    padding:10px 11px;
  }

  .back{
    font-size:32px;
  }
}
</style>
</head>

<body>

<script>

/* ============================= */
/* 難度設定 */
/* ============================= */

const levels={

  easy:{
    name:"🟢 初級 ×1",
    pairs:6,
    multiplier:1,
    time:0,
    penalty:10,
    reward:100
  },

  normal:{
    name:"🔵 中級 ×2",
    pairs:12,
    multiplier:2,
    time:180,
    penalty:20,
    reward:200
  },

  hard:{
    name:"🟠 高級 ×4",
    pairs:18,
    multiplier:4,
    time:150,
    penalty:40,
    reward:400
  },

  pro:{
    name:"🔴 專業 ×8",
    pairs:24,
    multiplier:8,
    time:120,
    penalty:80,
    reward:800
  }

};


/* ============================= */
/* 圖案 */
/* ============================= */

const emojis=[

  "🐶",
  "🐱",
  "🐰",
  "🦊",
  "🐼",
  "🐸",
  "🐵",
  "🐯",
  "🦁",
  "🐨",
  "🐷",
  "🐮",
  "🐹",
  "🐻",
  "🐙",
  "🦄",
  "🐝",
  "🦋",
  "🐳",
  "🐬",
  "🦖",
  "🦕",
  "🍎",
  "🍉"

];


/* ============================= */
/* 遊戲變數 */
/* ============================= */

let level="easy";

let cards=[];

let first=null;
let second=null;

let lock=false;

let score=0;
let moves=0;
let combo=0;
let matched=0;

let timeLeft=0;

let timerId=null;


/* ============================= */
/* 音效系統 */
/* ============================= */

let audio=null;

let music=false;

let sound=true;

let musicTimer=null;

let musicStep=0;


/* ============================= */
/* DOM */
/* ============================= */

const $=id=>
  document.getElementById(id);


/* ============================= */
/* 洗牌 */
/* ============================= */

function shuffle(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      array[i],
      array[j]
    ]=[
      array[j],
      array[i]
    ];

  }

  return array;

}


/* ============================= */
/* 啟動音效 */
/* ============================= */

function audioInit(){

  if(!audio){

    audio=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audio.state==="suspended"
  ){

    audio.resume();

  }

}


/* ============================= */
/* 音效 */
/* ============================= */

function tone(
  frequency,
  duration=.12,
  type="sine",
  volume=.045
){

  if(!sound)return;

  audioInit();

  const oscillator=
    audio.createOscillator();

  const gain=
    audio.createGain();

  oscillator.type=type;

  oscillator.frequency.value=
    frequency;

  gain.gain.value=
    volume;

  oscillator.connect(gain);

  gain.connect(
    audio.destination
  );

  const now=
    audio.currentTime;

  gain.gain.setValueAtTime(
    volume,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+duration
  );

  oscillator.start(now);

  oscillator.stop(
    now+duration
  );

}


/* ============================= */
/* 配對成功音效 */
/* ============================= */

function successSound(){

  if(!sound)return;

  tone(660,.1);

  setTimeout(
    ()=>tone(880,.12),
    90
  );

  setTimeout(
    ()=>tone(1047,.2),
    180
  );

}


/* ============================= */
/* 完成音效 */
/* ============================= */

function finishSound(){

  if(!sound)return;

  [
    523,
    659,
    784,
    1047,
    1319
  ].forEach(
    (frequency,index)=>{

      setTimeout(
        ()=>tone(
          frequency,
          .25,
          "sine",
          .055
        ),
        index*110
      );

    }
  );

}


/* ============================= */
/* 錯誤音效 */
/* ============================= */

function wrongSound(){

  tone(
    170,
    .18,
    "sawtooth",
    .035
  );

}


/* ============================= */
/* 音效開關 */
/* ============================= */

function toggleSound(){

  sound=!sound;

  updateButtons();

  if(sound){

    tone(880,.1);

  }

}


/* ============================= */
/* 背景音樂 */
/* ============================= */

function toggleMusic(){

  music=!music;

  updateButtons();

  if(music){

    startMusic();

  }else{

    stopMusic();

  }

}


function startMusic(){

  audioInit();

  stopMusic();

  const melody=[

    262,
    330,
    392,
    330,
    294,
    349,
    440,
    349,
    262,
    330,
    392,
    523,
    440,
    392,
    330,
    262

  ];

  musicStep=0;

  musicTimer=
    setInterval(
      ()=>{

        if(!music)return;

        const frequency=
          melody[
            musicStep++
            %
            melody.length
          ];

        const oscillator=
          audio.createOscillator();

        const gain=
          audio.createGain();

        oscillator.type=
          "triangle";

        oscillator.frequency.value=
          frequency;

        gain.gain.value=
          .018;

        oscillator.connect(gain);

        gain.connect(
          audio.destination
        );

        const now=
          audio.currentTime;

        gain.gain.setValueAtTime(
          .018,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          now+.24
        );

        oscillator.start(now);

        oscillator.stop(
          now+.24
        );

      },
      300
    );

}


function stopMusic(){

  if(musicTimer){

    clearInterval(
      musicTimer
    );

    musicTimer=null;

  }

}


/* ============================= */
/* 更新按鈕文字 */
/* ============================= */

function updateButtons(){

  $("musicBtn1").textContent=
    "🎵 背景音樂："+

    (
      music
      ?"開"
      :"關"
    );

  $("musicBtn2").textContent=
    "🎵 音樂："+

    (
      music
      ?"開"
      :"關"
    );

  $("soundBtn1").textContent=
    "🔊 音效："+

    (
      sound
      ?"開"
      :"關"
    );

  $("soundBtn2").textContent=
    "🔊 音效："+

    (
      sound
      ?"開"
      :"關"
    );

}


/* ============================= */
/* 中央文字 */
/* ============================= */

function showToast(text){

  const toast=
    $("toast");

  toast.textContent=
    text;

  toast.classList.remove(
    "show"
  );

  void toast.offsetWidth;

  toast.classList.add(
    "show"
  );

}


/* ============================= */
/* 粒子 */
/* ============================= */

function particles(
  x,
  y,
  count=22
){

  const container=
    $("fx");


  for(
    let i=0;
    i<count;
    i++
  ){

    const spark=
      document.createElement(
        "i"
      );

    spark.className=
      "spark";

    spark.style.left=
      x+"px";

    spark.style.top=
      y+"px";


    const angle=
      Math.random()
      *
      Math.PI
      *
      2;


    const radius=
      70+
      Math.random()*180;


    spark.style.setProperty(
      "--x",
      Math.cos(angle)
      *
      radius
      +"px"
    );


    spark.style.setProperty(
      "--y",
      Math.sin(angle)
      *
      radius
      +"px"
    );


    const colors=[

      "#fff",
      "#ffd740",
      "#7df9ff",
      "#ff80ab",
      "#b388ff"

    ];


    spark.style.background=
      colors[
        i%colors.length
      ];


    container.appendChild(
      spark
    );


    setTimeout(
      ()=>spark.remove(),
      850
    );

  }


  const ring=
    document.createElement(
      "i"
    );

  ring.className=
    "ring";

  ring.style.left=
    x+"px";

  ring.style.top=
    y+"px";

  ring.style.width=
    "30px";

  ring.style.height=
    "30px";


  container.appendChild(
    ring
  );


  setTimeout(
    ()=>ring.remove(),
    700
  );

}


/* ============================= */
/* 開始遊戲 */
/* ============================= */

function startGame(){

  clearInterval(
    timerId
  );

  first=null;

  second=null;

  lock=false;

  score=0;

  moves=0;

  combo=0;

  matched=0;


  const lv=
    levels[level];


  timeLeft=
    lv.time;


  $("selectScreen")
    .classList
    .remove("active");


  $("gameScreen")
    .classList
    .add("active");


  $("levelName")
    .textContent=
    lv.name;


  $("score")
    .textContent=
    0;


  $("moves")
    .textContent=
    0;


  $("combo")
    .textContent=
    0;


  $("timer")
    .textContent=
    lv.time ||
    "∞";


  $("best")
    .textContent=
    localStorage.getItem(
      "memory20_"+level
    ) ||
    0;


  $("message")
    .textContent=
    "找到兩張一樣的卡片！";


  $("game").innerHTML="";


  const chosen=
    shuffle(
      [...emojis]
    )
    .slice(
      0,
      lv.pairs
    );


  cards=
    shuffle(
      [
        ...chosen,
        ...chosen
      ]
    );


  cards.forEach(
    emoji=>{

      const card=
        document.createElement(
          "div"
        );


      card.className=
        "card";


      card.dataset.emoji=
        emoji;


      card.innerHTML=`

        <div class="card-inner">

          <div class="face back">
            ❓
          </div>

          <div class="face front">
            ${emoji}
          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        ()=>{
          flip(card);
        }
      );


      $("game")
        .appendChild(card);

    }
  );


  /* 計時 */

  if(lv.time){

    timerId=
      setInterval(
        ()=>{

          timeLeft--;

          $("timer")
            .textContent=
            timeLeft;


          if(
            timeLeft<=0
          ){

            clearInterval(
              timerId
            );

            lock=true;

            $("message")
              .textContent=
              "⏰ 時間到！";

            wrongSound();

          }

        },
        1000
      );

  }

}


/* ============================= */
/* 翻牌 */
/* ============================= */

function flip(card){

  if(
    lock ||
    card===first ||
    card.classList.contains(
      "flipped"
    ) ||
    card.classList.contains(
      "matched"
    )
  ){

    return;

  }


  audioInit();


  card.classList.add(
    "flipped"
  );


  tone(
    430,
    .08
  );


  /* 第一張 */

  if(!first){

    first=card;

    return;

  }


  /* 第二張 */

  second=card;

  lock=true;

  moves++;


  $("moves")
    .textContent=
    moves;


  /* ============================= */
  /* 配對成功 */
  /* ============================= */

  if(
    first.dataset.emoji===
    second.dataset.emoji
  ){

    first.classList.add(
      "matched"
    );

    second.classList.add(
      "matched"
    );


    matched++;

    combo++;


    const lv=
      levels[level];


    score+=
      lv.reward*
      lv.multiplier
      +
      (
        combo-1
      )*
      25*
      lv.multiplier;


    $("score")
      .textContent=
      score;


    $("combo")
      .textContent=
      combo;


    if(
      combo>=5
    ){

      $("message")
        .textContent=
        "🌈 AMAZING ×"+
        combo+
        "！";

    }else if(
      combo>=3
    ){

      $("message")
        .textContent=
        "🔥 COMBO ×"+
        combo+
        "！";

    }else{

      $("message")
        .textContent=
        "✨ 配對成功！";

    }


    /* 光效位置 */

    const rect=
      second.getBoundingClientRect();


    particles(
      rect.left+
      rect.width/2,

      rect.top+
      rect.height/2,

      combo>=5
      ?38
      :24
    );


    successSound();


    if(
      combo>=5
    ){

      showToast(
        "🌈 AMAZING!"
      );

    }else{

      showToast(
        "✨ PERFECT!"
      );

    }


    first=null;

    second=null;

    lock=false;


    /* 全部完成 */

    if(
      matched===
      lv.pairs
    ){

      finish();

    }


  }

  /* ============================= */
  /* 配對錯誤 */
  /* ============================= */

  else{

    combo=0;


    score=
      Math.max(
        0,
        score-
        levels[level]
        .penalty
      );


    $("score")
      .textContent=
      score;


    $("combo")
      .textContent=
      0;


    $("message")
      .textContent=
      "💫 再試一次！";


    first.classList.add(
      "wrong"
    );

    second.classList.add(
      "wrong"
    );


    wrongSound();


    setTimeout(
      ()=>{

        first.classList.remove(
          "flipped",
          "wrong"
        );

        second.classList.remove(
          "flipped",
          "wrong"
        );


        first=null;

        second=null;

        lock=false;

      },
      700
    );

  }

}


/* ============================= */
/* 完成遊戲 */
/* ============================= */

function finish(){

  clearInterval(
    timerId
  );


  finishSound();


  showToast(
    "🎉 PERFECT CLEAR!"
  );


  setTimeout(
    ()=>{

      $("modal")
        .classList
        .add("show");

    },
    850
  );


  const lv=
    levels[level];


  const best=
    Number(
      localStorage.getItem(
        "memory20_"+level
      ) ||
      0
    );


  if(
    score>best
  ){

    localStorage.setItem(
      "memory20_"+level,
      score
    );

  }


  let stars;


  if(
    lv.time===0 ||
    timeLeft>
    lv.time*.5
  ){

    stars="⭐⭐⭐";

  }else if(
    timeLeft>
    lv.time*.2
  ){

    stars="⭐⭐";

  }else{

    stars="⭐";

  }


  $("stars")
    .textContent=
    stars;


  $("result")
    .innerHTML=
    "難度："+lv.name+
    "<br>"+
    "分數：<b>"+
    score+
    "</b>"+
    "<br>"+
    "步數：<b>"+
    moves+
    "</b>";

}


/* ============================= */
/* 回到選擇難度 */
/* ============================= */

function choose(){

  clearInterval(
    timerId
  );


  $("modal")
    .classList
    .remove("show");


  $("gameScreen")
    .classList
    .remove("active");


  $("selectScreen")
    .classList
    .add("active");

}


/* ============================= */
/* 按鈕 */
/* ============================= */

$("musicBtn1")
  .onclick=
  toggleMusic;


$("musicBtn2")
  .onclick=
  toggleMusic;


$("soundBtn1")
  .onclick=
  toggleSound;


$("soundBtn2")
  .onclick=
  toggleSound;


document
  .querySelectorAll(
    ".play"
  )
  .forEach(
    button=>{

      button.onclick=
        ()=>{

          level=
            button.dataset.level;

          startGame();

        };

    }
  );


$("restart")
  .onclick=
  startGame;


$("chooseBtn")
  .onclick=
  choose;


$("again")
  .onclick=
  ()=>{

    $("modal")
      .classList
      .remove("show");

    startGame();

  };


$("backResult")
  .onclick=
  choose;


/* 初始化 */

updateButtons();

</script>
