<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 擬真保齡球館</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0d0d13; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        
        .scoreboard {
            background: rgba(15, 18, 28, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 12px 20px; color: white; display: flex; justify-content: space-between;
            align-items: center; max-width: 500px; margin: 0 auto; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .score-box { text-align: center; }
        .score-label { font-size: 12px; color: #8a8d9b; text-transform: uppercase; }
        .score-value { font-size: 28px; font-weight: bold; color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .frame-indicator { font-size: 16px; font-weight: 600; color: #ff007f; }

        .announcement {
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            color: #fff; font-size: 42px; font-weight: 900; text-align: center;
            text-shadow: 0 0 20px #00f2fe, 0 0 40px #ff007f; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .announcement.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .controls-overlay {
            pointer-events: auto; display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none; border-radius: 25px; color: #000; font-weight: bold; font-size: 15px;
            padding: 12px 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-reset { background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%); color: white; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4); }

        .aim-guide {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7); font-size: 14px; text-align: center;
            background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud">
        <div class="scoreboard">
            <div class="score-box">
                <div class="score-label">目前局數</div>
                <div class="frame-indicator" id="frame-txt">第 1 局 (球 1)</div>
            </div>
            <div class="score-box">
                <div class="score-label">總得分</div>
                <div class="score-value" id="score-txt">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">擊倒瓶數</div>
                <div class="score-value" style="color:#ff007f;" id="pins-txt">0</div>
            </div>
        </div>

        <div class="announcement" id="announce">STRIKE! 全倒</div>

        <div class="aim-guide" id="guide-txt">向上滑動或拖曳滑鼠投球</div>

        <div class="controls-overlay">
            <button class="btn" onclick="moveBall(-0.2)">← 左移</button>
            <button class="btn" onclick="directBowl()">直接投球</button>
            <button class="btn" onclick="moveBall(0.2)">右移 →</button>
            <button class="btn btn-reset" onclick="resetGame()">重新開始</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, world;
        let ballMesh, ballBody;
        let pinMeshes = [], pinBodies = [];
        let isPushed = false, score = 0, currentFrame = 1, ballRolls = 1, knockedPins = 0;
        let startY = 0, startX = 0, isDragging = false;

        const PIN_POSITIONS = [
            [0, 0],
            [-0.25, -0.4], [0.25, -0.4],
            [-0.5, -0.8], [0, -0.8], [0.5, -0.8],
            [-0.75, -1.2], [-0.25, -1.2], [0.25, -1.2], [0.75, -1.2]
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0d13);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.8, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const light = new THREE.PointLight(0x00f2fe, 1.2, 30);
            light.position.set(0, 5, 2);
            light.castShadow = true;
            scene.add(light);

            const spotLight = new THREE.SpotLight(0xff007f, 1);
            spotLight.position.set(0, 8, -10);
            scene.add(spotLight);

            createLane();
            createBall();
            createPins();

            setupInteraction();
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createLane() {
            const laneGeo = new THREE.BoxGeometry(2, 0.1, 18);
            const laneMat = new THREE.MeshStandardMaterial({ color: 0xd2a679, roughness: 0.2 });
            const laneMesh = new THREE.Mesh(laneGeo, laneMat);
            laneMesh.position.set(0, -0.05, -7);
            laneMesh.receiveShadow = true;
            scene.add(laneMesh);

            const laneBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1, 0.05, 9)) });
            laneBody.position.set(0, -0.05, -7);
            world.addBody(laneBody);
        }

        function createBall() {
            const radius = 0.18;
            const ballGeo = new THREE.SphereGeometry(radius, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, metalness: 0.8, roughness: 0.1 });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            scene.add(ballMesh);

            ballBody = new CANNON.Body({
                mass: 5,
                shape: new CANNON.Sphere(radius),
                position: new CANNON.Vec3(0, radius, 3)
            });
            world.addBody(ballBody);
        }

        function createPins() {
            pinMeshes.forEach(m => scene.remove(m));
            pinBodies.forEach(b => world.remove(b));
            pinMeshes = []; pinBodies = [];

            const pinGeo = new THREE.CylinderGeometry(0.05, 0.08, 0.38, 16);
            const pinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

            PIN_POSITIONS.forEach((pos) => {
                const mesh = new THREE.Mesh(pinGeo, pinMat);
                mesh.castShadow = true;
                scene.add(mesh);
                pinMeshes.push(mesh);

                const body = new CANNON.Body({
                    mass: 0.8,
                    shape: new CANNON.Cylinder(0.05, 0.08, 0.38, 16),
                    position: new CANNON.Vec3(pos[0], 0.19, -12 + pos[1])
                });
                world.addBody(body);
                pinBodies.push(body);
            });
        }

        function setupInteraction() {
            const container = document.body;

            const handleStart = (y, x) => {
                if (isPushed) return;
                startY = y; startX = x;
                isDragging = true;
            };

            const handleEnd = (y, x) => {
                if (!isDragging || isPushed) return;
                isDragging = false;
                const deltaY = startY - y;
                const deltaX = x - startX;

                if (deltaY > 30) {
                    const speed = Math.min(deltaY * 0.12, 22);
                    const curve = deltaX * 0.01;
                    launchBall(speed, curve);
                }
            };

            container.addEventListener('mousedown', e => handleStart(e.clientY, e.clientX));
            container.addEventListener('mouseup', e => handleEnd(e.clientY, e.clientX));
            container.addEventListener('touchstart', e => handleStart(e.touches[0].clientY, e.touches[0].clientX));
            container.addEventListener('touchend', e => handleEnd(e.changedTouches[0].clientY, e.changedTouches[0].clientX));
        }

        function launchBall(speed, curveX) {
            isPushed = true;
            document.getElementById('guide-txt').style.opacity = '0';
            ballBody.velocity.set(curveX, 0, -speed);
            ballBody.angularVelocity.set(-speed * 2, 0, 0);

            setTimeout(checkPins, 4000);
        }

        function directBowl() {
            if (isPushed) return;
            launchBall(16, (Math.random() - 0.5) * 0.5);
        }

        function moveBall(dir) {
            if (isPushed) return;
            const newX = Math.max(-0.7, Math.min(0.7, ballBody.position.x + dir));
            ballBody.position.x = newX;
            ballMesh.position.x = newX;
        }

        function checkPins() {
            let currentKnocked = 0;
            pinBodies.forEach(body => {
                const upVector = new CANNON.Vec3(0, 1, 0);
                const pinUp = body.quaternion.vmult(new CANNON.Vec3(0, 1, 0));
                if (pinUp.dot(upVector) < 0.6) {
                    currentKnocked++;
                }
            });

            const newlyKnocked = currentKnocked - knockedPins;
            knockedPins = currentKnocked;
            score += newlyKnocked * 10;

            document.getElementById('score-txt').innerText = score;
            document.getElementById('pins-txt').innerText = knockedPins;

            if (knockedPins === 10 && ballRolls === 1) {
                showAnnounce("STRIKE! 全倒");
            } else if (knockedPins === 10 && ballRolls === 2) {
                showAnnounce("SPARE! 補倒");
            } else if (newlyKnocked > 0) {
                showAnnounce(`擊倒 ${newlyKnocked} 瓶！`);
            } else {
                showAnnounce("洗溝！");
            }

            setTimeout(resetBall, 1500);
        }

        function showAnnounce(text) {
            const el = document.getElementById('announce');
            el.innerText = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1200);
        }

        function resetBall() {
            ballBody.position.set(0, 0.18, 3);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
            camera.position.set(0, 1.8, 4.5);
            isPushed = false;
            document.getElementById('guide-txt').style.opacity = '1';

            if (knockedPins === 10 || ballRolls === 2) {
                ballRolls = 1;
                currentFrame++;
                knockedPins = 0;
                createPins();
            } else {
                ballRolls = 2;
            }
            document.getElementById('frame-txt').innerText = `第 ${currentFrame} 局 (球 ${ballRolls})`;
        }

        function resetGame() {
            score = 0; currentFrame = 1; ballRolls = 1; knockedPins = 0;
            document.getElementById('score-txt').innerText = '0';
            document.getElementById('pins-txt').innerText = '0';
            document.getElementById('frame-txt').innerText = '第 1 局 (球 1)';
            createPins();
            resetBall();
        }

        function animate() {
            requestAnimationFrame(animate);

            world.step(1 / 60);

            ballMesh.position.copy(ballBody.position);
            ballMesh.quaternion.copy(ballBody.quaternion);

            pinMeshes.forEach((mesh, i) => {
                mesh.position.copy(pinBodies[i].position);
                mesh.quaternion.copy(pinBodies[i].quaternion);
            });

            if (isPushed && ballBody.position.z > -10) {
                camera.position.z = ballBody.position.z + 1.8;
                camera.position.x = ballBody.position.x * 0.5;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
