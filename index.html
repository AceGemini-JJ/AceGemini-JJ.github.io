<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小遊戲大集合</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #2d3748;
        }
        p {
            font-size: 14px;
            color: #718096;
            margin-bottom: 30px;
        }
        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-btn {
            display: block;
            padding: 16px 24px;
            background: #4299e1;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3);
        }
        .game-btn:hover {
            background: #3182ce;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(66, 153, 225, 0.4);
        }
        .game-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 小遊戲大集合</h1>
        <p>請選擇想遊玩的遊戲：</p>
        
        <div class="game-menu">
            <!-- 第一個按鈕：精準連結至 記憶2.html -->
            <a href="記憶2.html" class="game-btn">🧠記憶遊戲</a>

            <!-- 第二個按鈕：連結至 保齡球.html -->
            <a href="保齡球.html" class="game-btn">🎳 遊戲 2 (保齡球)</a>

            <!-- 第三個按鈕：連結至 記憶翻牌3.html -->
            <a href="記憶翻牌3.html" class="game-btn">🃏 遊戲 3 (記憶翻牌 3)</a>
        </div>
    </div>

</body>
</html>
